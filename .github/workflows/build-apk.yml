name: Build GameKeyboard APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          mkdir project
          unzip -q GameKeyboard_Android_Project_with_Cloud_Build.zip -d project
          find project -name settings.gradle.kts

      - name: Build APK
        run: |
          cd project/GameKeyboard
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameKeyboard-APK
          path: project/GameKeyboard/app/build/outputs/apk/debug/app-debug.apk
